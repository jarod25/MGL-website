meta:
  title: 'Informations pratiques'

title: 'Informations pratiques'
lead: 'Les informations essentielles pour préparer votre venue au Mulhouse Gaming Tournament.'

place:
  title: 'Lieu et horaires'
  address_name: 'PHG Academy – KMØ'
  address_street: '30 rue François Spoerry'
  address_city: '68100 Mulhouse'
  map_title: 'Carte Google Maps de PHG Academy KMØ à Mulhouse'
  maps_link: 'Ouvrir l’adresse dans Google Maps'
  text: 'Le tournoi aura lieu les 29 et 30 août 2026 à PHG Academy – KMØ, Mulhouse. L’arrivée des participants est demandée à 9 h, avec des horaires prévus de 9 h à 21 h. League of Legends et Rocket League sont prévus le samedi ; Valorant et EA FC 26 sont prévus le dimanche.'

sections:
  access:
    title: 'Accès'
    text: 'L’accès est réservé aux participants inscrits, aux membres de l’organisation et aux personnes autorisées. Les spectateurs ne sont pas autorisés, sauf accord exceptionnel. Une pièce d’identité, une preuve d’inscription et, si nécessaire, les documents pour les participants mineurs pourront être demandés. Les participants peuvent sortir et revenir pendant la journée.'
  equipment:
    title: 'Matériel personnel'
    text: 'Chaque participant doit prévoir tout le matériel nécessaire pour jouer. Pour une tour, il faut notamment apporter l’ordinateur, l’écran, le clavier, la souris, le casque, les câbles et les alimentations nécessaires. Le participant reste responsable du matériel qu’il apporte.'
  rental:
    title: 'Location de PC'
    text: 'Des PC peuvent être proposés à la location, uniquement sur réservation et dans la limite des stocks disponibles. La configuration prévue comprend une RTX 3070 Ti, un i9-12900KF, 32 Go de RAM, un SSD 1 To et un écran 240 Hz. Même avec une location, le joueur doit apporter ses périphériques personnels.'
  provided:
    title: 'Fourni sur place'
    text: 'PHG Academy fournit les bureaux, les chaises, l’alimentation électrique, le réseau, les switchs et les câbles Ethernet. Les participants doivent suivre les consignes d’installation données par l’organisation sur place.'
  food:
    title: 'Nourriture et boissons'
    text: 'Des sandwichs, collations et une cafétéria peuvent être disponibles sur place. Les boissons extérieures sont interdites, sauf l’eau, et les gourdes ou bouteilles peuvent être contrôlées. L’alcool est strictement interdit. Le tabac et le vapotage sont autorisés uniquement à l’extérieur.'
  conduct:
    title: 'Comportement'
    text: 'Un comportement respectueux est attendu envers les joueurs, les organisateurs, les arbitres, les encadrants, les agents de sécurité, les locaux et le matériel. Les insultes, menaces, discriminations, violences, dégradations ou comportements perturbateurs sont interdits et peuvent entraîner une sanction.'
  cheat:
    title: 'Comptes et triche'
    text: 'Les joueurs doivent utiliser leur compte personnel ou un compte déclaré à l’organisation, avec un niveau réel annoncé honnêtement. Les logiciels de triche, scripts, outils donnant un avantage injuste et modifications non autorisées du gameplay sont interdits. Les règles détaillées seront précisées dans les règlements spécifiques de chaque jeu.'
  refund:
    title: 'Annulation et remboursement'
    text: 'Une demande d’annulation effectuée jusqu’à 7 jours avant le tournoi concerné donne droit à un remboursement intégral. Après ce délai, aucun remboursement n’est prévu sauf décision exceptionnelle de l’organisation. En cas d’absence le jour du tournoi, le billet est considéré comme utilisé.'
  rules:
    title: 'Règlements et documents'
    text: 'L’inscription implique l’acceptation du règlement général et des règlements spécifiques aux jeux concernés. Les règlements de chaque jeu seront ajoutés séparément. Des photos et vidéos peuvent être prises pendant l’événement, et les participants mineurs devront fournir les documents demandés avant l’événement.'
    download: 'Consulter le règlement général'
    unavailable: 'Document bientôt disponible'
