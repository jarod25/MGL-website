schools:
  title: 'Les écoles et établissements'
  intro: 'Le Mulhouse Gaming Tournament est organisé par des étudiants de l’<a href="https://www.enscmu.uha.fr/" target="_blank" rel="noopener noreferrer">ENSCMu</a> et le XID de l’<a href="https://www.ensisa.uha.fr/" target="_blank" rel="noopener noreferrer">ENSISA</a>, en partenariat avec PHG Academy. L’ENSCMu et l’ENSISA font partie de l’<a href="https://www.uha.fr/" target="_blank" rel="noopener noreferrer">Université de Haute-Alsace</a>.'
  website_link: 'Voir le site'
  enscmu:
    title: 'ENSCMu'
    text: 'École d’ingénieurs de l’Université de Haute-Alsace, l’ENSCMu participe à l’organisation étudiante du tournoi.'
  ensisa:
    title: 'ENSISA / XID'
    text: 'École d’ingénieurs de l’Université de Haute-Alsace, l’ENSISA est impliquée via le XID de l’ENSISA.'
  phg_academy:
    title: 'PHG Academy'
    text: 'Partenaire d’accueil du tournoi, PHG Academy met à disposition le lieu et l’environnement technique de l’événement au KMØ Mulhouse.'
