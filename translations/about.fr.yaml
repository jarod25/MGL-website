  lead: 'Le Mulhouse Gaming Tournament est un tournoi de jeux vidéo organisé à Mulhouse autour de plusieurs compétitions.'
  objective: 'L’événement propose un cadre simple pour accueillir les participants, constituer les équipes et présenter les jeux du week-end.'
schools:
  title: 'Les écoles et établissements'
  generic: 'Le tournoi est organisé avec des étudiants et des établissements mulhousiens, notamment l’Université de Haute-Alsace, l’ENSCMu et l’ENSISA.'
organizers:
  title: 'L’équipe organisatrice'
  generic: 'Une équipe d’étudiants et d’organisateurs prépare l’événement. Une liste détaillée des membres, rôles et photos pourra être ajoutée ultérieurement dans public/images/team/ au format prenom-nom.webp.'
