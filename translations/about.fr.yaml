  descriptions:
    phg_academy: 'Partenaire d’accueil du tournoi, PHG Academy met à disposition le lieu et l’environnement technique nécessaires à l’organisation de l’événement au KMØ Mulhouse.'
    crous_strasbourg: 'Acteur central de la vie étudiante, le Crous de Strasbourg accompagne les étudiants sur des sujets comme les aides, le logement, la restauration, l’action sociale et les initiatives étudiantes.'
    mulhouse_alsace_agglomeration: 'Mulhouse Alsace Agglomération soutient le territoire mulhousien et ses projets locaux, notamment autour de l’attractivité, de l’enseignement supérieur, de la jeunesse et de la vie du territoire.'
    universite_haute_alsace: 'Université ancrée à Mulhouse et Colmar, l’UHA rassemble notamment l’ENSCMu et l’ENSISA, deux écoles impliquées dans l’organisation étudiante du tournoi.'
    ikoula: 'Ikoula est un hébergeur et infogéreur français proposant des solutions d’hébergement web, de serveurs et de cloud. Ikoula héberge le site du Mulhouse Gaming Tournament.<br>Site hébergé par <a href="https://www.ikoula.com/fr/hebergement-web/linux?utm_source=enscmu&utm_medium=banner&utm_campaign=iksvp" target="_blank" rel="noopener noreferrer">Ikoula</a>.'
    enscmu: 'Première école de chimie de France, l’ENSCMu est une école d’ingénieurs de l’Université de Haute-Alsace. Des étudiants de l’école participent à l’organisation du tournoi.'
    ensisa: 'École d’ingénieurs de l’Université de Haute-Alsace, l’ENSISA forme notamment dans les domaines de l’informatique, des réseaux, de l’automatique, de la mécanique, du textile et du génie industriel. Le XID participe à l’organisation du tournoi.'
