  descriptions:
    phg_academy: 'Als Gastgeberpartner des Turniers stellt PHG Academy den Ort und die technische Umgebung für die Durchführung der Veranstaltung im KMØ Mulhouse bereit.'
    crous_strasbourg: 'Der Crous de Strasbourg ist ein wichtiger Akteur des studentischen Lebens und unterstützt Studierende unter anderem bei Beihilfen, Wohnen, Verpflegung, sozialer Begleitung und studentischen Projekten.'
    mulhouse_alsace_agglomeration: 'Mulhouse Alsace Agglomération unterstützt das Gebiet Mulhouse und lokale Projekte, insbesondere in den Bereichen Attraktivität, Hochschulbildung, Jugend und Leben im Gebiet.'
    universite_haute_alsace: 'Die Université de Haute-Alsace ist in Mulhouse und Colmar verankert und umfasst unter anderem ENSCMu und ENSISA, zwei Schulen, die an der studentischen Organisation des Turniers beteiligt sind.'
    ikoula: 'Ikoula ist ein französischer Hosting- und Managed-Services-Anbieter mit Lösungen für Webhosting, Server und Cloud. Ikoula hostet die Website des Mulhouse Gaming Tournament.<br>Website gehostet von <a href="https://www.ikoula.com/fr/hebergement-web/linux?utm_source=enscmu&utm_medium=banner&utm_campaign=iksvp" target="_blank" rel="noopener noreferrer">Ikoula</a>.'
    enscmu: 'Die ENSCMu ist die erste Chemieschule Frankreichs und eine Ingenieurschule der Université de Haute-Alsace. Studierende der Schule beteiligen sich an der Organisation des Turniers.'
    ensisa: 'Die ENSISA ist eine Ingenieurschule der Université de Haute-Alsace mit Studienrichtungen wie Informatik, Netzwerke, Automatik, Mechanik, Textil und Wirtschaftsingenieurwesen. Das XID beteiligt sich an der Organisation des Turniers.'
