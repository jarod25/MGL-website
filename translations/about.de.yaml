schools:
  title: 'Schulen und Einrichtungen'
  intro: 'Das Mulhouse Gaming Tournament wird von Studierenden der <a href="https://www.enscmu.uha.fr/" target="_blank" rel="noopener noreferrer">ENSCMu</a> und dem XID der <a href="https://www.ensisa.uha.fr/" target="_blank" rel="noopener noreferrer">ENSISA</a> in Partnerschaft mit PHG Academy organisiert. ENSCMu und ENSISA gehören zur <a href="https://www.uha.fr/" target="_blank" rel="noopener noreferrer">Université de Haute-Alsace</a>.'
  website_link: 'Website öffnen'
  enscmu:
    title: 'ENSCMu'
    text: 'Als Ingenieurschule der Université de Haute-Alsace beteiligt sich die ENSCMu an der studentischen Organisation des Turniers.'
  ensisa:
    title: 'ENSISA / XID'
    text: 'Die ENSISA ist eine Ingenieurschule der Université de Haute-Alsace. Sie ist über XID, ihren Informatik- und Videospielclub, beteiligt.'
  phg_academy:
    title: 'PHG Academy'
    text: 'Als Gastgeberpartner stellt PHG Academy den Ort und die technische Umgebung der Veranstaltung im KMØ Mulhouse bereit.'
