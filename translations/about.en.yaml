schools:
  title: 'Schools and institutions'
  intro: 'The Mulhouse Gaming Tournament is organized by students from <a href="https://www.enscmu.uha.fr/" target="_blank" rel="noopener noreferrer">ENSCMu</a> and the XID of <a href="https://www.ensisa.uha.fr/" target="_blank" rel="noopener noreferrer">ENSISA</a>, in partnership with PHG Academy. ENSCMu and ENSISA are part of <a href="https://www.uha.fr/" target="_blank" rel="noopener noreferrer">Université de Haute-Alsace</a>.'
  website_link: 'Visit website'
  enscmu:
    title: 'ENSCMu'
    text: 'An engineering school of Université de Haute-Alsace, ENSCMu is involved in the student organisation of the tournament.'
  ensisa:
    title: 'ENSISA / XID'
    text: 'ENSISA is an engineering school of Université de Haute-Alsace. It is involved through XID, its computer science and video game club.'
  phg_academy:
    title: 'PHG Academy'
    text: 'As the host partner, PHG Academy provides the venue and technical environment for the event at KMØ Mulhouse.'
