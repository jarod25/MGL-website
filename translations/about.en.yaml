  descriptions:
    phg_academy: 'As the host partner of the tournament, PHG Academy provides the venue and technical environment needed to run the event at KMØ Mulhouse.'
    crous_strasbourg: 'A key player in student life, Crous de Strasbourg supports students through financial aid, housing, catering, social support and student initiatives.'
    universite_haute_alsace: 'Based in Mulhouse and Colmar, Université de Haute-Alsace includes ENSCMu and ENSISA, two schools involved in the student organisation of the tournament.'
    ikoula: 'Ikoula is a French hosting and managed services provider offering web hosting, server and cloud solutions. Ikoula hosts the Mulhouse Gaming Tournament website.<br>Website hosted by <a href="https://www.ikoula.com/fr/hebergement-web/linux?utm_source=enscmu&utm_medium=banner&utm_campaign=iksvp" target="_blank" rel="noopener noreferrer">Ikoula</a>.'
    enscmu: 'The first chemistry school in France, ENSCMu is an engineering school of Université de Haute-Alsace. Students from the school are involved in organising the tournament.'
    ensisa: 'ENSISA is an engineering school of Université de Haute-Alsace, with programmes including computer science, networks, automation, mechanics, textiles and industrial engineering. The XID is involved in organising the tournament.'
