meta: { title: 'Praktische Informationen' }
title: 'Praktische Informationen'
lead: 'Wichtige Informationen zur Vorbereitung Ihres Besuchs beim Mulhouse Gaming Tournament.'
place:
  title: 'Ort und Zeiten'
  address_name: 'PHG Academy – KMØ'
  address_street: '30 rue François Spoerry'
  address_city: '68100 Mulhouse'
  map_title: 'Google-Maps-Karte der PHG Academy KMØ in Mulhouse'
  maps_link: 'Adresse in Google Maps öffnen'
  items: ['Ankunft um 9:00 Uhr erbeten.', 'Veranstaltung von 9:00 Uhr bis maximal 20:00 Uhr.', 'Samstag, 29. August 2026.', 'Sonntag, 30. August 2026.', 'Zuschauer sind nicht erlaubt.', 'Teilnehmende können tagsüber hinausgehen und wieder zurückkommen.']
bring:
  title: 'Mitgebrachte Ausrüstung'
  intro: 'Alle Teilnehmenden sollten normalerweise ihr vollständiges Setup mitbringen.'
  items: ['Desktop-Computer: Tower, Bildschirm, Tastatur, Maus, Headset, Mauspad, Netzteile und erforderliche Kabel.', 'Laptop: Computer, Ladegerät, Tastatur, Maus und Headset je nach Bedarf des Spielers oder der Spielerin.']
  note: 'Alle zum Spielen benötigten persönlichen Geräte müssen von den Teilnehmenden mitgebracht werden, außer wenn vorab ein Miet-PC reserviert wurde.'
rental:
  title: 'PC-Miete'
  intro: 'Die Miete ist optional, nur mit Reservierung möglich, abhängig vom Bestand, wird später über HelloAsso verwaltet, und der Preis wird noch nicht angezeigt.'
  items: ['Grafikkarte: NVIDIA GeForce RTX 3070 Ti.', 'Prozessor: Intel Core i9-12900KF.', 'Arbeitsspeicher: 32 GB Corsair Vengeance RGB Pro 3200 MHz.', 'SSD: WD Black SN770 1 TB.', 'Festplatte: Seagate Barracuda 2 TB, 7200 U/min.', 'Bildschirm: Zowie XL2540K, 24,5 Zoll, 240 Hz.', 'Auch bei einer Miete müssen Teilnehmende Tastatur, Maus, Headset und Mauspad mitbringen.']
  note: 'Vorgesehene Konfiguration für Mietplätze, vorbehaltlich Verfügbarkeit oder Ersatz durch gleichwertige Ausstattung.'
provided:
  title: 'Von PHG Academy bereitgestellte Ausstattung'
  items: ['PHG Academy stellt Tisch, Stuhl, Stromversorgung, Netzwerkverbindung, Netzwerkswitch und Ethernet-Kabel bereit.', 'Spielerinnen und Spieler müssen keinen Tisch, Stuhl, Switch, kein Ethernet-Kabel und keine Mehrfachsteckdose mitbringen, sofern die Organisation nichts anderes mitteilt.']
food:
  title: 'Essen und Getränke'
  items: ['Mitgebrachtes Essen ist verboten.', 'Sandwiches sind in bestimmten Paketen verfügbar.', 'Eine Kfet ist vor Ort vorhanden.', 'Mitgebrachte Getränke sind verboten, außer Wasser.', 'Behälter können im Rahmen der Sicherheitsanweisungen kontrolliert werden.', 'Alkohol ist verboten.', 'Rauchen und E-Zigaretten sind nur draußen erlaubt.']
  note: 'Bei medizinischer Notwendigkeit, Allergien oder besonderer Ernährung wenden Sie sich bitte vor der Veranstaltung an die Organisation.'
access:
  title: 'Zugang und Verhalten'
  items: ['Ein physisches Ausweisdokument ist verpflichtend.', 'Minderjährige Teilnehmende müssen eine unterschriebene Einverständniserklärung eines Erziehungsberechtigten vorlegen.', 'Keine Zuschauer.', 'Der Veranstaltungsort, die Ausrüstung, das Sicherheitspersonal, die Organisatoren, Betreuungspersonen und andere Spielerinnen und Spieler sind zu respektieren.', 'Ein wohlwollendes Verhalten wird erwartet.', 'Jede vorsätzliche Beschädigung kann zum Ausschluss führen.']
security:
  title: 'Persönliche Ausrüstung und Sicherheit'
  note: 'Alle Teilnehmenden bleiben für die mitgebrachte Ausrüstung verantwortlich und müssen sie während der Veranstaltung beaufsichtigen. Ein Sicherheitsdienst wird anwesend sein, aber jeder Vorfall, Schaden, Verlust oder jedes Problem muss der Organisation sofort gemeldet werden. Das endgültige allgemeine Reglement kann die Verantwortlichkeiten genauer festlegen.'
cheat:
  title: 'Accounts, Smurfs und Cheating'
  items: ['Spielerinnen und Spieler müssen ihr Hauptkonto oder ihr übliches Konto verwenden und ihr Niveau ehrlich angeben.', 'Das angegebene Niveau sollte dem tatsächlichen Niveau möglichst genau entsprechen, damit ein stimmiger Wettbewerb organisiert werden kann.', 'Cheat-Software, Skripte, vorteilsverschaffende Tools, unerlaubte Gameplay-Änderungen und Cheating während der Matches sind verboten.', 'Mögliche Sanktionen: Verwarnung, Änderung von Ergebnissen oder Platzierung, sofern das Reglement dies vorsieht, Ausschluss von einem Match oder Ausschluss vom Turnier.']
  note: 'Die genauen Modalitäten werden in den Regeln jedes Spiels festgelegt.'
image:
  title: 'Genehmigung zur Aufnahme und Veröffentlichung von Bildmaterial'
  items: ['Während der Veranstaltung können Fotos und Videos aufgenommen werden.', 'Vor der Veranstaltung wird eine Genehmigung zur Aufnahme und Veröffentlichung angeboten.', 'Teilnehmende können der Organisation ihre Wahl mitteilen.', 'Die detaillierten Modalitäten werden im entsprechenden Dokument aufgeführt.']
refund:
  title: 'Stornierung und Rückerstattung'
  note: 'Tickets können bis sieben Tage vor Beginn der Veranstaltung erstattet werden. Nach diesem Datum sind Abwesenheiten und Stornierungen nicht mehr erstattungsfähig. Wenn die Veranstaltung von der Organisation abgesagt wird, werden die Tickets vollständig erstattet. Für diese Ausgabe ist die Frist Samstag, der 22. August 2026 um 23:59 Uhr. Diese öffentliche Information ersetzt nicht die zukünftigen allgemeinen Bedingungen oder das vollständige Reglement.'
rules:
  title: 'Regelwerke'
  items: ['Ein allgemeines Reglement gilt für die Veranstaltung.', 'Für jedes Spiel gibt es eigene Regeln oder es werden eigene Regeln bereitgestellt.', 'Mit der Anmeldung werden das allgemeine Reglement sowie die Regeln des oder der gewählten Spiele akzeptiert.', 'Die Dokumente werden vor dem Turnier bereitgestellt und können auf dieser Seite heruntergeladen werden.']
  download: 'Reglement ansehen'
  unavailable: 'Dokument bald verfügbar'
