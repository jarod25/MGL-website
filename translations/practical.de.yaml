meta:
  title: 'Praktische Informationen'

title: 'Praktische Informationen'
lead: 'Wichtige Informationen zur Vorbereitung Ihres Besuchs beim Mulhouse Gaming Tournament.'

place:
  title: 'Ort und Zeiten'
  address_name: 'PHG Academy – KMØ'
  address_street: '30 rue François Spoerry'
  address_city: '68100 Mulhouse'
  map_title: 'Google-Maps-Karte der PHG Academy KMØ in Mulhouse'
  maps_link: 'Adresse in Google Maps öffnen'
  items:
    - 'Samstag, 29. August 2026 und Sonntag, 30. August 2026.'
    - 'Ankunft um 9:00 Uhr erbeten.'
    - 'Geplante Zeiten: 9:00 Uhr bis 21:00 Uhr.'
    - 'League of Legends und Rocket League am Samstag.'
    - 'Valorant und EA FC 26 am Sonntag.'

access:
  title: 'Zugang'
  items:
    - 'Der Zugang ist angemeldeten Teilnehmenden, der Organisation und autorisierten Personen vorbehalten.'
    - 'Zuschauer sind nicht erlaubt, außer bei ausdrücklicher Genehmigung durch die Organisation.'
    - 'Ein Ausweisdokument und ein Anmeldenachweis können verlangt werden.'
    - 'Teilnehmende können tagsüber hinausgehen und wieder zurückkommen.'

equipment:
  title: 'Persönliche Ausrüstung'
  intro: 'Alle Teilnehmenden müssen ihre Spielausrüstung vorbereiten.'
  items:
    - 'Für einen Desktop-PC: Computer, Bildschirm, Tastatur, Maus, Headset, Kabel und erforderliche Netzteile.'
    - 'Für einen Laptop: Computer, Ladegerät und erforderliche Peripheriegeräte.'
    - 'Teilnehmende bleiben für die mitgebrachte Ausrüstung verantwortlich.'
  note: 'Am Veranstaltungstag kann kein Ersatz garantiert werden, sofern keine Miete, Leihe oder Bereitstellung im Voraus vereinbart wurde.'

rental:
  title: 'PC-Miete'
  intro: 'PCs können zur Miete angeboten werden, nur mit Reservierung und vorbehaltlich verfügbarer Bestände.'
  items:
    - 'Vorgesehene Konfiguration: RTX 3070 Ti, i9-12900KF, 32 GB RAM, 1 TB SSD und 240-Hz-Bildschirm.'
    - 'Die Miete ermöglicht es, keinen vollständigen Computer mitzubringen.'
    - 'Auch bei einer Miete müssen eigene Peripheriegeräte mitgebracht werden: Tastatur, Maus, Headset und Mauspad.'
  note: 'Preis und verfügbare Bestände werden im Anmeldeprozess angegeben.'

provided:
  title: 'Vor Ort bereitgestellt'
  items:
    - 'PHG Academy stellt Tische und Stühle bereit.'
    - 'Stromversorgung, Netzwerkzugang, Switches und Ethernet-Kabel sind vor Ort vorgesehen.'
    - 'Teilnehmende müssen die Installationsanweisungen der Organisation befolgen.'

food:
  title: 'Essen und Getränke'
  items:
    - 'Sandwiches, Snacks und eine Cafeteria können vor Ort verfügbar sein.'
    - 'Mitgebrachte Getränke sind verboten, außer Wasser.'
    - 'Trinkflaschen und Wasserflaschen können kontrolliert werden.'
    - 'Alkohol ist streng verboten.'
    - 'Rauchen und Vaping sind nur draußen erlaubt.'
  note: 'Bei medizinischer Notwendigkeit, Allergien oder besonderer Ernährung wenden Sie sich bitte vor der Veranstaltung an die Organisation.'

conduct:
  title: 'Verhalten'
  items:
    - 'Respekt gegenüber Spielern, Organisatoren, Schiedsrichtern, Betreuungspersonen, Sicherheitspersonal, Räumlichkeiten und Ausrüstung ist erforderlich.'
    - 'Fair Play, Wohlwollen und Respekt werden während der gesamten Veranstaltung erwartet.'
    - 'Beleidigungen, Drohungen, Diskriminierung, Gewalt, Beschädigung oder störendes Verhalten sind verboten.'
  note: 'Regelwidriges Verhalten kann zu einer Sanktion oder zum Ausschluss führen.'

cheat:
  title: 'Accounts und Cheating'
  items:
    - 'Spielerinnen und Spieler müssen ihr persönliches Konto oder ein der Organisation gemeldetes Konto verwenden.'
    - 'Das tatsächliche Spielniveau muss ehrlich angegeben werden.'
    - 'Cheat-Software, Skripte, vorteilsverschaffende Tools und unerlaubte Gameplay-Änderungen sind verboten.'
    - 'Die detaillierten Match-Regeln werden in den spezifischen Regeln jedes Spiels festgelegt.'

refund:
  title: 'Stornierung und Rückerstattung'
  items:
    - 'Eine vollständige Rückerstattung ist bis 7 Tage vor dem betreffenden Turnier möglich.'
    - 'Nach dieser Frist ist keine Rückerstattung vorgesehen, außer durch eine außergewöhnliche Entscheidung der Organisation.'
    - 'Bei Abwesenheit am Turniertag gilt das Ticket als genutzt.'
    - 'Bei Ausschluss wegen Nichteinhaltung der Regeln ist keine Rückerstattung vorgesehen.'

rules:
  title: 'Regelwerke und Dokumente'
  items:
    - 'Mit der Anmeldung wird das allgemeine Reglement akzeptiert.'
    - 'Jedes Spiel erhält eigene spezifische Regeln.'
    - 'Während der Veranstaltung können Fotos und Videos aufgenommen werden.'
    - 'Eine separate Einwilligung zur Nutzung des Bildes kann angeboten werden.'
    - 'Minderjährige Teilnehmende müssen die angeforderten Dokumente vor der Veranstaltung vorlegen.'
  download: 'Allgemeines Reglement ansehen'
  unavailable: 'Dokument bald verfügbar'
