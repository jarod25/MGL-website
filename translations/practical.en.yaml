meta:
  title: 'Practical information'

title: 'Practical information'
lead: 'Key information to prepare your visit to the Mulhouse Gaming Tournament.'

place:
  title: 'Venue and schedule'
  address_name: 'PHG Academy – KMØ'
  address_street: '30 rue François Spoerry'
  address_city: '68100 Mulhouse'
  map_title: 'Google Maps map of PHG Academy KMØ in Mulhouse'
  maps_link: 'Open the address in Google Maps'
  items:
    - 'Saturday, August 29, 2026 and Sunday, August 30, 2026.'
    - 'Arrival requested at 9:00 a.m.'
    - 'Planned hours: 9:00 a.m. to 9:00 p.m.'
    - 'League of Legends and Rocket League on Saturday.'
    - 'Valorant and EA FC 26 on Sunday.'

access:
  title: 'Access'
  items:
    - 'Access is reserved for registered participants, the organisation and authorised persons.'
    - 'Spectators are not allowed, unless exceptionally authorised by the organisation.'
    - 'An identity document and proof of registration may be requested.'
    - 'Participants may leave and come back during the day.'

equipment:
  title: 'Personal equipment'
  intro: 'Each participant must prepare their gaming equipment.'
  items:
    - 'For a desktop setup: computer, monitor, keyboard, mouse, headset, cables and required power supplies.'
    - 'For a laptop: computer, charger and required peripherals.'
    - 'Participants remain responsible for the equipment they bring.'
  note: 'No replacement can be guaranteed on the day of the event unless rental, loan or provision has been arranged in advance.'

rental:
  title: 'PC rental'
  intro: 'PCs may be available for rental, by reservation only and subject to stock availability.'
  items:
    - 'Planned configuration: RTX 3070 Ti, i9-12900KF, 32 GB RAM, 1 TB SSD and 240 Hz monitor.'
    - 'Rental allows players to avoid bringing their full computer setup.'
    - 'Even with a rental, players must bring their own peripherals: keyboard, mouse, headset and mouse pad.'
  note: 'Price and stock availability will be specified through the registration process.'

provided:
  title: 'Provided on site'
  items:
    - 'PHG Academy provides desks and chairs.'
    - 'Power supply, network access, switches and Ethernet cables are planned on site.'
    - 'Participants must follow the setup instructions given by the organisation.'

food:
  title: 'Food and drinks'
  items:
    - 'Sandwiches, snacks and a cafeteria may be available on site.'
    - 'Outside drinks are prohibited, except water.'
    - 'Water bottles and flasks may be checked.'
    - 'Alcohol is strictly prohibited.'
    - 'Smoking and vaping are allowed outside only.'
  note: 'For a medical need, allergy or specific diet, please contact the organisation before the event.'

conduct:
  title: 'Conduct'
  items:
    - 'Respect for players, organisers, referees, supervisors, security staff, premises and equipment is required.'
    - 'Fair play, goodwill and respect are expected throughout the event.'
    - 'Insults, threats, discrimination, violence, damage or disruptive behaviour are prohibited.'
  note: 'Behaviour contrary to the rules may result in a sanction or exclusion.'

cheat:
  title: 'Accounts and cheating'
  items:
    - 'Players must use their personal account or an account declared to the organisation.'
    - 'The real skill level must be declared honestly.'
    - 'Cheat software, scripts, tools providing an advantage and unauthorised gameplay modifications are prohibited.'
    - 'Detailed match rules will be specified in each game-specific rulebook.'

refund:
  title: 'Cancellation and refunds'
  items:
    - 'A full refund is possible up to 7 days before the relevant tournament.'
    - 'After this deadline, no refund is planned except by exceptional decision of the organisation.'
    - 'In the event of absence on the tournament day, the ticket is considered used.'
    - 'No refund is planned in the event of exclusion for failure to comply with the rules.'

rules:
  title: 'Rules and documents'
  items:
    - 'Registration implies acceptance of the general regulations.'
    - 'Each game will have its own specific rules.'
    - 'Photos and videos may be taken during the event.'
    - 'A separate image rights authorisation may be offered.'
    - 'Underage participants must provide the requested documents before the event.'
  download: 'View general regulations'
  unavailable: 'Document coming soon'
